name: send

on:
  schedule:
    - cron: "17 11-23/3 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Nunca roda duas vezes ao mesmo tempo; a segunda espera a primeira terminar.
concurrency:
  group: send
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run send
        env:
          CURRICULO_PDF_DRIVE_ID: ${{ secrets.CURRICULO_PDF_DRIVE_ID }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          MEU_EMAIL: ${{ secrets.MEU_EMAIL }}
          NOME_CANDIDATO: ${{ secrets.NOME_CANDIDATO }}
